<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dig a Hole — Where Would You Come Up?</title>
  <link rel="stylesheet" href="styles.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="globe"></canvas>

  <div id="hud-top">
    <h1>DIG A HOLE</h1>
    <p class="sub">Where would you come up on the other side?</p>
  </div>

  <div id="hud-instructions">
    <span class="dot"></span> Drag to rotate &nbsp;·&nbsp; scroll to zoom &nbsp;·&nbsp; <b>click the globe</b> to spear it
  </div>

  <div id="hud-panel" class="hidden">
    <div class="panel-row">
      <div class="label">ENTRY</div>
      <div class="coords" id="entry-coords">—</div>
      <div class="place" id="entry-place">…</div>
    </div>
    <div class="arrow">↳ through the core ↴</div>
    <div class="panel-row exit">
      <div class="label">EXIT</div>
      <div class="coords" id="exit-coords">—</div>
      <div class="place" id="exit-place">…</div>
    </div>
    <div class="actions">
      <button id="spin-toggle" data-target="exit">Spin to exit</button>
      <button id="copy-coords">Copy coords</button>
      <button id="clear">Clear</button>
    </div>
  </div>

  <div id="cursor-readout"></div>

  <div id="scene-controls">
    <button id="rotation-toggle" class="ctrl-btn" aria-label="Pause earth rotation" title="Pause earth rotation">
      <span class="ic-on">❚❚</span><span class="ic-off">▶</span>
    </button>
    <div class="slider-block">
      <span class="slider-label">SUN</span>
      <div class="slider-row">
        <label class="vslider" title="Sun longitude">
          <input id="sun-lon" type="range" min="-180" max="180" step="1" value="45" orient="vertical" />
          <span class="axis">LON</span>
        </label>
        <label class="vslider" title="Sun altitude">
          <input id="sun-alt" type="range" min="-90" max="90" step="1" value="35" orient="vertical" />
          <span class="axis">ALT</span>
        </label>
      </div>
    </div>
  </div>

  <div id="audio-controls">
    <button id="sfx-toggle" aria-label="Toggle click sound" title="Toggle click sound">
      <span class="ic-on">◉</span><span class="ic-off">∅</span>
    </button>
    <button id="audio-toggle" aria-label="Toggle ambient sound" title="Toggle ambient sound">
      <span class="ic-on">♪</span><span class="ic-off">∅</span>
    </button>
  </div>

  <div id="credit">
    made by <a href="https://telmuun.com" target="_blank" rel="noopener">teedger</a>
    <span class="sep">·</span>
    <a href="https://x.com/teedger" target="_blank" rel="noopener">@teedger</a>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
